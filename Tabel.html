    <h2>Table Merge</h2>
        <!-- rowspan: menggabungkan baris
            rowspan : menggabungkan kolom -->

        <table border="2" width="900px" height="700px">
            <tr>
                <td rowspan="3">A</td>
                <td rowspan="2">B</td>
                <td colspan="2">C</td>
                <td rowspan="3">D</td>
                <td rowspan="4">E</td>
                <td rowspan="2">N</td>
                <td rowspan="6">H</td>
            </tr>

            <tr>
                <td>F</td>
                <td>G</td>
            </tr>

            <tr>
                <td>I</td>
                <td>J</td>
                <td>K</td>
                <td rowspan="2">O</td>
            </tr>

            <tr>
                <td colspan="5">M</td>
            </tr>

            <tr>
                <td rowspan="2">P</td>
                <td colspan="2">Q</td>
                <td rowspan="2">R</td>
                <td>U</td>
                <td>V</td>
                <td>W</td>
            </tr>

            <tr>
                <td>S</td>
                <td>T</td>
                <td>X</td>
                <td>Y</td>
                <td>Z</td>
            </tr>
        </table>
